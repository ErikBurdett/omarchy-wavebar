name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate manifest JSON
        run: /usr/bin/python3 -m json.tool manifest.json >/dev/null

      - name: Test manifest contract
        run: /usr/bin/python3 tests/test_manifest.py

      - name: Test recorder lifecycle and waveform model
        run: /usr/bin/python3 tests/test_waveform.py

      - name: Test bounded media matching
        run: node tests/test_media_model.js

      - name: Reject packaged symbolic links
        run: test -z "$(find . -type l -print -quit)"

  qml:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # qs.Commons and qs.Ui are root-relative Quickshell imports that only
      # resolve against an Omarchy shell tree, so standalone qmllint needs one
      # checked out beside the plugin. Pinned to a commit: an unpinned lint
      # dependency turns an upstream edit into a red build on an untouched PR.
      - name: Check out the Omarchy shell that supplies qs.Commons and qs.Ui
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: basecamp/omarchy
          ref: 346e69e1cec6c4e8924531874af6ba010a1bc99e # v4.0.2
          path: omarchy
          persist-credentials: false

      - name: Install Qt QML tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools

      # Catches what the manifest and unit tests cannot: a QML type that never
      # resolves. An unresolved type is not a parse error, so it reaches a user
      # as a component that silently fails to load at login.
      - name: Lint QML
        run: |
          qmllint=$(command -v qmllint || echo /usr/lib/qt6/bin/qmllint)
          "$qmllint" --version
          # Omarchy exposes the injected bar host and nested style tokens as
          # QtObject, so their members have no concrete type for standalone
          # tooling; that one category stays informational, everything else
          # fails the build. Diagnostics are only printed on failure.
          if ! "$qmllint" --silent --max-warnings 0 --missing-property info \
            -I omarchy/shell \
            -i omarchy/shell/Commons/qmldir \
            -i omarchy/shell/Ui/qmldir \
            *.qml; then
            echo "::error::qmllint reported warnings" >&2
            "$qmllint" --max-warnings 0 --missing-property info \
              -I omarchy/shell \
              -i omarchy/shell/Commons/qmldir \
              -i omarchy/shell/Ui/qmldir \
              *.qml 2>&1 | grep -E '^(Warning|Error):' >&2 || true
            exit 1
          fi
